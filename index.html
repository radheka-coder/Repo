<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Deep Liquid Calm</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f141a;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    filter: blur(6px); /* slightly reduced for mobile GPU */
}
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height, dpr;
let particles = [];
let particleCount;

const pointer = { x: -1000, y: -1000 };

// Muted zen palette
const colors = [
    'rgba(147,165,201,0.3)',
    'rgba(172,153,194,0.3)',
    'rgba(158,189,171,0.3)',
    'rgba(219,212,180,0.2)'
];

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Adaptive particle count for mobile
    particleCount = width < 768 ? 180 : 350;
    initParticles();
}

function initParticles() {
    particles = [];
    for (let i = 0; i < particleCount; i++) {
        const x = Math.random() * width;
        const y = Math.random() * height;
        particles.push({
            x, y,
            ox: x, oy: y,
            vx: 0, vy: 0,
            r: Math.random() * 28 + 18,
            c: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

function draw() {
    ctx.fillStyle = 'rgba(15,20,26,0.06)';
    ctx.fillRect(0, 0, width, height);

    for (const p of particles) {
        const dx = pointer.x - p.x;
        const dy = pointer.y - p.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 220) {
            const force = (220 - dist) / 220;
            const angle = Math.atan2(dy, dx);
            p.vx -= Math.cos(angle) * force * 0.7;
            p.vy -= Math.sin(angle) * force * 0.7;
        }

        // Slow return
        p.vx += (p.ox - p.x) * 0.0035;
        p.vy += (p.oy - p.y) * 0.0035;

        p.vx *= 0.965;
        p.vy *= 0.965;

        p.x += p.vx;
        p.y += p.vy;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.c;
        ctx.fill();
    }

    requestAnimationFrame(draw);
}

// Touch + mouse unified
function updatePointer(e) {
    const t = e.touches ? e.touches[0] : e;
    pointer.x = t.clientX;
    pointer.y = t.clientY;
}

window.addEventListener('mousemove', updatePointer);
window.addEventListener('touchstart', updatePointer, { passive: true });
window.addEventListener('touchmove', updatePointer, { passive: true });
window.addEventListener('resize', resize);

// Init
resize();
draw();
</script>
</body>
</html>
