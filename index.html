<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Mandala Loom</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #0d0805; /* Very dark earth tone */
        }
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const particleCount = 380; 
        const mouse = { x: -2000, y: -2000 };
        let breatheCycle = 0;

        const colors = [
            { r: 255, g: 140, b: 40 },  // Saffron
            { r: 212, g: 175, b: 55 },  // Antique Gold
            { r: 40, g: 140, b: 140 },  // Muted Peacock
            { r: 180, g: 80, b: 100 }   // Deep Lotus
        ];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 60;
                const x = width / 2 + Math.cos(angle) * radius;
                const y = height / 2 + Math.sin(angle) * radius;
                
                particles.push({
                    x: x, y: y,
                    originX: x, originY: y,
                    vx: 0, vy: 0,
                    radius: Math.random() * 2 + 1,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function drawSymmetricPoint(x, y, r, color, opacity) {
            const centerX = width / 2;
            const centerY = height / 2;
            const dx = x - centerX;
            const dy = y - centerY;
            
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI / 4) * i;
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                const rotatedX = centerX + (dx * cos - dy * sin);
                const rotatedY = centerY + (dx * sin + dy * cos);
                
                ctx.beginPath();
                ctx.arc(rotatedX, rotatedY, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${opacity})`;
                ctx.fill();
            }
        }

        function draw() {
            // Slow fade for a dreamy silk effect
            ctx.fillStyle = 'rgba(13, 8, 5, 0.12)'; 
            ctx.fillRect(0, 0, width, height);

            // PULSING CENTER (Breathing Guide)
            breatheCycle += 0.01;
            const pulseSize = 40 + Math.sin(breatheCycle) * 15;
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, pulseSize, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(212, 175, 55, ${0.1 + (Math.sin(breatheCycle) * 0.05)})`;
            ctx.lineWidth = 2;
            ctx.stroke();

            particles.forEach(p => {
                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const radius = 120; 

                if (dist < radius) {
                    const force = (radius - dist) / radius;
                    const angle = Math.atan2(dy, dx);
                    
                    // Slower push for migraine safety
                    p.vx -= Math.cos(angle) * force * 0.8; 
                    p.vy -= Math.sin(angle) * force * 0.8;
                }

                const homeDx = p.originX - p.x;
                const homeDy = p.originY - p.y;
                
                // SLOW RETURN (0.001)
                p.vx += homeDx * 0.001;
                p.vy += homeDy * 0.001;

                // HEAVY FRICTION (0.92) for slow-motion feel
                p.vx *= 0.92; 
                p.vy *= 0.92;
                p.x += p.vx;
                p.y += p.vy;

                const moveSpeed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                const opacity = Math.min(0.7, 0.2 + moveSpeed * 0.4);

                drawSymmetricPoint(p.x, p.y, p.radius, p.color, opacity);
            });

            requestAnimationFrame(draw);
        }

        const updateMouse = (e) => {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.x = x;
            mouse.y = y;
        };

        window.addEventListener('mousemove', updateMouse);
        window.addEventListener('touchmove', (e) => {
            updateMouse(e);
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('resize', init);
        init();
        draw();
    </script>
</body>
</html>
